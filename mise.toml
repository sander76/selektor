[shell_alias]
py="ptpython"

# cd into the root of the git folder.
r='cd $(git rev-parse --show-toplevel)'

gitopen='gh browse -b $(git branch --show-current)'


[env]
_.python.venv = { path = ".venv", create = true }

[hooks]
enter = "uv pip install pytest-pudb-resurrected ptpython pre-commit"

[tasks.qa]
description = "run linting and formatting"
run = [
	'uv run ruff format',
    'uv run ruff check --fix'
]
